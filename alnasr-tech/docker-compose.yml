version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alnasr_tech
      POSTGRES_USER: alnasr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alnasr_secure_2024}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alnasr -d alnasr_tech"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    shm_size: '128mb'
    # Production: do not expose port externally
    # networks:
    #   - internal

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${SERVER_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://alnasr:${POSTGRES_PASSWORD:-alnasr_secure_2024}@postgres:5432/alnasr_tech
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in production}
      JWT_EXPIRATION_SECS: ${JWT_EXPIRATION_SECS:-3600}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      ETA_CLIENT_ID: ${ETA_CLIENT_ID:-placeholder}
      ETA_CLIENT_SECRET: ${ETA_CLIENT_SECRET:-placeholder}
      ETA_TOKEN_URL: ${ETA_TOKEN_URL:-https://id.preprod.eta.gov.eg/connect/token}
      ETA_SUBMISSION_URL: ${ETA_SUBMISSION_URL:-https://api.preprod.eta.gov.eg/api/v1/documentsubmissions}
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-noreply@alnasr.tech}
      SMTP_PASS: ${SMTP_PASS:-change_me}
      SMTP_FROM: ${SMTP_FROM:-Al-Nasr Tech <noreply@alnasr.tech>}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn,tower_http=warn}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "2"
        reservations:
          memory: 128M
          cpus: "0.5"

volumes:
  pgdata:
